<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmisense Instant & Substitute Search</title>
    <!-- Tailwind CSS UI Framework -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SQLite WebAssembly Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-5 flex flex-col items-center">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
        
        <!-- Header & Search Box -->
        <div class="p-4 sm:p-6 bg-slate-900 text-white">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-3">
                <h1 class="text-lg sm:text-xl font-bold text-teal-400">Pharmisense Instant & Substitute Search</h1>
                <div id="status" class="text-[11px] px-3 py-1 bg-slate-800 rounded-full text-slate-300">
                    Loading Database Engine...
                </div>
            </div>
            
            <div class="relative">
                <input type="text" id="searchInput" oninput="handleSearch()" onkeyup="handleSearch()" disabled
                    placeholder="Enter brand name or API..." 
                    class="w-full px-4 sm:px-5 py-3 sm:py-3.5 rounded-xl text-slate-900 text-sm sm:text-base font-medium shadow-inner focus:outline-none focus:ring-4 focus:ring-teal-400 disabled:bg-slate-200">
            </div>
        </div>

        <!-- Sub-header status -->
        <div class="px-4 sm:px-6 py-2 bg-slate-50 border-b border-slate-200 flex justify-between items-center text-xs text-slate-500 font-semibold">
            <span id="resultsCount">Waiting for search input...</span>
            <span class="hidden sm:inline">Tap any card to view exact substitutes</span>
        </div>

        <!-- Main Search Results Card Container (Mobile Optimized) -->
        <div id="resultsContainer" class="p-3 sm:p-5 space-y-3 max-h-[65vh] overflow-y-auto bg-slate-50/50">
            <div class="p-10 text-center text-slate-400 text-sm bg-white rounded-xl border border-slate-200 shadow-sm">
                Type a brand name or active ingredient above to start searching.
            </div>
        </div>
    </div>

    <!-- Substitute Popup Modal -->
    <div id="substituteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-3 sm:p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden flex flex-col">
            
            <!-- Modal Header -->
            <div class="p-4 sm:p-5 bg-teal-800 text-white flex justify-between items-start">
                <div class="pr-2">
                    <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-teal-200">Selected Medicine</span>
                    <h2 id="modalBrand" class="text-xl sm:text-2xl font-bold leading-tight mt-0.5">--</h2>
                    <p id="modalComposition" class="text-teal-100 text-xs sm:text-sm mt-1">--</p>
                </div>
                <button onclick="closeModal()" class="text-teal-200 hover:text-white text-3xl font-bold leading-none p-1">&times;</button>
            </div>

            <!-- Modal Body (Substitutes List) -->
            <div class="p-4 sm:p-5 overflow-y-auto flex-1 bg-slate-50">
                <h3 class="text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-wider mb-3">
                    Alternative Brands (Same Composition & Exact Strength)
                </h3>
                
                <div id="substitutesList" class="space-y-2.5">
                    <!-- Dynamic Content -->
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-3 sm:p-4 bg-slate-100 border-t border-slate-200 text-right">
                <button onclick="closeModal()" class="w-full sm:w-auto px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-sm font-semibold transition">
                    Close Window
                </button>
            </div>
        </div>
    </div>

    <script>
        let db = null;
        const tableName = "250k release type";

        // Tier-1 Manufacturers Priority list
        const tierOneManufacturers = [
            "Sun Pharmaceutical Industries Ltd", "Intas Pharmaceuticals Ltd", "Cipla Ltd",
            "Torrent Pharmaceuticals Ltd", "Alkem Laboratories Ltd", "Lupin Ltd",
            "Zydus Cadila", "Micro Labs Ltd", "Abbott", "Macleods Pharmaceuticals Pvt Ltd",
            "Mankind Pharma Ltd", "Dr Reddy's Laboratories Ltd", "Glenmark Pharmaceuticals Ltd",
            "Alembic Pharmaceuticals Ltd", "Ipca Laboratories Ltd", "Ajanta Pharma Ltd"
        ];

        async function initDatabase() {
            const statusEl = document.getElementById('status');
            try {
                const sqlPromise = initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
                const dataPromise = fetch('250k med.db').then(res => {
                    if (!res.ok) throw new Error("Database file '250k med.db' not found.");
                    return res.arrayBuffer();
                });

                const [SQL, buf] = await Promise.all([sqlPromise, dataPromise]);
                db = new SQL.Database(new Uint8Array(buf));
                
                statusEl.className = "text-[11px] px-3 py-1 bg-emerald-900 text-emerald-300 font-bold rounded-full";
                statusEl.innerText = "✓ Engine Ready (240k+ SKUs)";
                
                const inputEl = document.getElementById('searchInput');
                inputEl.disabled = false;
                
                if (inputEl.value.trim().length >= 1) {
                    handleSearch();
                }
            } catch (err) {
                statusEl.className = "text-[11px] px-3 py-1 bg-rose-900 text-rose-300 font-bold rounded-full";
                statusEl.innerText = "Error: " + err.message;
            }
        }

        function handleSearch() {
            if (!db) return;
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('resultsContainer');
            const countEl = document.getElementById('resultsCount');

            if (!query || query.length === 0) {
                container.innerHTML = `<div class="p-10 text-center text-slate-400 text-sm bg-white rounded-xl border border-slate-200 shadow-sm">Type a brand name or active ingredient above to start searching.</div>`;
                countEl.innerText = "Waiting for search input...";
                return;
            }

            try {
                const stmt = db.prepare(`
                    SELECT * FROM "${tableName}" 
                    WHERE "Brand Name" LIKE :q OR "API (Active Ingredients Only)" LIKE :q 
                    LIMIT 100
                `);
                
                stmt.bind({ ':q': `%${query}%` });
                let rows = [];
                while (stmt.step()) {
                    rows.push(stmt.getAsObject());
                }
                stmt.free();

                if (rows.length === 0) {
                    container.innerHTML = `<div class="p-10 text-center text-slate-400 text-sm bg-white rounded-xl border border-slate-200 shadow-sm">No matching medicines found. Try searching by active ingredient.</div>`;
                    countEl.innerText = "0 results found";
                    return;
                }

                // Sort results placing Tier-1 manufacturers first silently
                rows.sort((a, b) => {
                    let aTier = tierOneManufacturers.includes(a['Manufacturer']) ? 0 : 1;
                    let bTier = tierOneManufacturers.includes(b['Manufacturer']) ? 0 : 1;
                    return aTier - bTier;
                });

                countEl.innerText = `Displaying top ${rows.length} matches`;

                container.innerHTML = rows.map(r => {
                    const brand = r['Brand Name'] || '-';
                    const mfr = r['Manufacturer'] || '-';
                    const api = r['API (Active Ingredients Only)'] || '-';
                    const strength = r['Exact Strength Group'] || '-';
                    const pack = r['Pack Size'] || '-';
                    const category = r['Category'] || '';

                    return `
                        <div onclick="openSubstituteModal('${escapeAttr(api)}', '${escapeAttr(strength)}', '${escapeAttr(brand)}')" 
                            class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md active:bg-teal-50/50 transition cursor-pointer flex flex-col gap-2">
                            <div class="flex justify-between items-start gap-2">
                                <div>
                                    <h3 class="font-bold text-slate-900 text-base sm:text-lg leading-snug">${escapeHtml(brand)}</h3>
                                    <p class="text-xs text-teal-700 font-semibold mt-0.5">${escapeHtml(api)} <span class="text-slate-400 font-normal">(${escapeHtml(strength)})</span></p>
                                </div>
                                ${category ? `<span class="px-2 py-1 bg-slate-100 text-slate-700 rounded-md text-[11px] font-medium whitespace-nowrap">${escapeHtml(category)}</span>` : ''}
                            </div>
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center text-xs text-slate-500 pt-2 border-t border-slate-100 gap-1">
                                <span><strong>Mfr:</strong> ${escapeHtml(mfr)}</span>
                                <span class="bg-teal-50 text-teal-800 px-2 py-0.5 rounded font-bold text-[11px]">Pack: ${escapeHtml(pack)}</span>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="p-10 text-center text-rose-500 text-sm bg-white rounded-xl border border-slate-200">Query error: ${e.message}</div>`;
            }
        }

        function openSubstituteModal(api, strength, brandName) {
            document.getElementById('modalBrand').innerText = brandName;
            document.getElementById('modalComposition').innerText = `API: ${api} | Strength: ${strength}`;

            const listEl = document.getElementById('substitutesList');
            listEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm bg-white rounded-xl">Loading exact substitutes...</div>`;
            document.getElementById('substituteModal').classList.remove('hidden');

            try {
                const stmt = db.prepare(`
                    SELECT * FROM "${tableName}" 
                    WHERE "API (Active Ingredients Only)" = :api 
                    AND "Exact Strength Group" = :strength
                `);
                
                stmt.bind({ ':api': api, ':strength': strength });
                let subs = [];
                while (stmt.step()) {
                    subs.push(stmt.getAsObject());
                }
                stmt.free();

                // Sort substitutes placing Tier-1 manufacturers on top silently
                subs.sort((a, b) => {
                    let aTier = tierOneManufacturers.includes(a['Manufacturer']) ? 0 : 1;
                    let bTier = tierOneManufacturers.includes(b['Manufacturer']) ? 0 : 1;
                    return aTier - bTier;
                });

                if (subs.length === 0) {
                    listEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm bg-white rounded-xl border border-slate-200">No alternative brands found for this exact formulation.</div>`;
                } else {
                    listEl.innerHTML = subs.map(s => `
                        <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-1">
                            <h4 class="font-bold text-slate-900 text-sm sm:text-base">${escapeHtml(s['Brand Name'])}</h4>
                            <p class="text-xs text-slate-600"><strong>Manufacturer:</strong> ${escapeHtml(s['Manufacturer'])}</p>
                            <p class="text-xs text-slate-500"><strong>Pack Size:</strong> ${escapeHtml(s['Pack Size'])}</p>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error(e);
                listEl.innerHTML = `<div class="p-6 text-center text-rose-500 text-sm bg-white rounded-xl">Error loading substitutes.</div>`;
            }
        }

        function closeModal() {
            document.getElementById('substituteModal').classList.add('hidden');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeAttr(str) {
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        window.onload = initDatabase;
    </script>
</body>
</html>
