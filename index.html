<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmisense Clinical & Substitute Search</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="min-h-screen py-4 px-2 flex justify-center items-center">

    <div class="w-full max-w-md sm:max-w-2xl bg-slate-50 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col h-[88vh] sm:h-[82vh]">

        <div class="p-5 bg-gradient-to-r from-slate-900 via-slate-800 to-indigo-950 text-white flex-shrink-0 shadow-md">

            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>

                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">
                        Pharmisense
                        <span class="text-indigo-400 font-light">Rx</span>
                    </h1>
                </div>

                <div id="status" class="text-[10px] px-2.5 py-1 bg-slate-800/80 border border-slate-700 rounded-full text-slate-300 font-medium">
                    Loading database...
                </div>
            </div>

            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z">
                        </path>
                    </svg>
                </span>

                <input
                    type="text"
                    id="searchInput"
                    oninput="debounceSearch()"
                    disabled
                    placeholder="Search medicine, brand or composition..."
                    class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/95 text-slate-900 text-sm font-medium shadow-inner placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-slate-200 transition"
                >
            </div>
        </div>

        <div class="px-5 py-2.5 bg-white border-b border-slate-200 flex justify-between items-center text-[11px] text-slate-500 font-semibold flex-shrink-0 shadow-sm">
            <span id="resultsCount">Preparing database...</span>
            <span class="text-slate-600 font-bold">~Vivek Garg</span>
        </div>

        <div id="resultsContainer" class="p-3.5 space-y-2.5 overflow-y-auto flex-1 bg-slate-100/70">
            <div class="p-10 text-center text-slate-400 text-xs bg-white rounded-2xl border border-slate-200 shadow-sm mt-4">
                Loading your medicine catalogue...
            </div>
        </div>
    </div>

    <div id="substituteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm p-3">

        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full max-h-[85vh] overflow-hidden flex flex-col border border-slate-200">

            <div class="p-4 bg-gradient-to-r from-indigo-900 to-slate-900 text-white flex justify-between items-start flex-shrink-0">
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-300">
                        Exact Composition Match
                    </span>

                    <h2 id="modalBrand" class="text-base sm:text-lg font-bold leading-tight mt-0.5 text-white">
                        -
                    </h2>

                    <p id="modalComposition" class="text-indigo-100 text-xs mt-1 font-medium">
                        -
                    </p>
                </div>

                <button
                    onclick="closeModal()"
                    class="text-slate-300 hover:text-white bg-slate-800/60 hover:bg-slate-700 w-8 h-8 rounded-full flex items-center justify-center text-lg font-bold transition">
                    &times;
                </button>
            </div>

            <div id="substitutesList" class="p-3.5 overflow-y-auto flex-1 bg-slate-50 space-y-2">
            </div>

            <div class="p-3 bg-white border-t border-slate-200 text-right flex-shrink-0">
                <button
                    onclick="closeModal()"
                    class="w-full px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold shadow transition">
                    Close Window
                </button>
            </div>
        </div>
    </div>

    <script>
        /*
         * IMPORTANT:
         * Keep the database file in the same GitHub folder as index.html.
         */
        const databaseFile = "268k med.db";

        let db = null;
        let tableName = null;
        let searchTimeout = null;

        const topPharmaCompanies = [
            "Sun Pharmaceutical Industries Ltd",
            "Intas Pharmaceuticals Ltd",
            "Cipla Ltd",
            "Torrent Pharmaceuticals Ltd",
            "Alkem Laboratories Ltd",
            "Lupin Ltd",
            "Zydus Cadila",
            "Micro Labs Ltd",
            "Abbott",
            "Macleods Pharmaceuticals Pvt Ltd",
            "Mankind Pharma Ltd",
            "Dr Reddy's Laboratories Ltd",
            "Glenmark Pharmaceuticals Ltd",
            "Alembic Pharmaceuticals Ltd",
            "Ipca Laboratories Ltd",
            "Ajanta Pharma Ltd",
            "Sun Pharma",
            "Cipla",
            "Intas",
            "Torrent",
            "Alkem",
            "Lupin",
            "Dr Reddy"
        ];

        function isTopCompany(manufacturer) {
            if (!manufacturer) return false;

            return topPharmaCompanies.some(company =>
                manufacturer.toLowerCase().includes(company.toLowerCase())
            );
        }

        async function initDatabase() {
            const statusElement = document.getElementById("status");
            const resultsContainer = document.getElementById("resultsContainer");
            const resultsCount = document.getElementById("resultsCount");

            try {
                const SQL = await initSqlJs({
                    locateFile: file =>
                        `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });

                const response = await fetch(databaseFile);

                if (!response.ok) {
                    throw new Error(
                        `The file "${databaseFile}" was not found.`
                    );
                }

                const databaseBuffer = await response.arrayBuffer();

                db = new SQL.Database(
                    new Uint8Array(databaseBuffer)
                );

                /*
                 * Automatically find the medicine table.
                 * This means you do not need to know its exact name.
                 */
                const tableResult = db.exec(`
                    SELECT name
                    FROM sqlite_master
                    WHERE type = 'table'
                    AND name NOT LIKE 'sqlite_%'
                    ORDER BY name
                `);

                if (
                    !tableResult.length ||
                    !tableResult[0].values.length
                ) {
                    throw new Error(
                        "No medicine table was found inside the database."
                    );
                }

                const allTables = tableResult[0].values.map(row => row[0]);

                /*
                 * Prefer a table containing words such as medicine,
                 * release, drug, product or pharma.
                 */
                tableName =
                    allTables.find(name =>
                        /medicine|medic|release|drug|product|pharma/i.test(name)
                    ) || allTables[0];

                console.log("Database loaded:", databaseFile);
                console.log("Table selected:", tableName);
                console.log("Available tables:", allTables);

                statusElement.className =
                    "text-[10px] px-2.5 py-1 bg-emerald-950 border border-emerald-800 text-emerald-300 font-bold rounded-full";

                statusElement.innerText = "● System Online";

                resultsCount.innerText =
                    "Database ready - search your catalogue";

                document.getElementById("searchInput").disabled = false;

                resultsContainer.innerHTML = `
                    <div class="p-10 text-center text-slate-400 text-xs bg-white rounded-2xl border border-slate-200 shadow-sm mt-4">
                        Type a medicine, brand name or composition to begin searching.
                    </div>
                `;

            } catch (error) {
                console.error("Database loading error:", error);

                statusElement.className =
                    "text-[10px] px-2.5 py-1 bg-rose-950 border border-rose-800 text-rose-300 font-bold rounded-full";

                statusElement.innerText = "Database Error";

                resultsCount.innerText = "Unable to load database";

                resultsContainer.innerHTML = `
                    <div class="p-6 text-center text-rose-500 text-xs bg-white rounded-2xl border border-rose-200">
                        <p class="font-bold mb-2">
                            Database could not be loaded.
                        </p>

                        <p>
                            Make sure <b>268k med.db</b> is uploaded in the same GitHub folder as index.html.
                        </p>

                        <p class="mt-2 text-slate-500">
                            ${escapeHtml(error.message)}
                        </p>
                    </div>
                `;
            }
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);

            searchTimeout = setTimeout(() => {
                handleSearch();
            }, 250);
        }

        function handleSearch() {
            if (!db || !tableName) return;

            const searchInput = document.getElementById("searchInput");
            const container = document.getElementById("resultsContainer");
            const resultsCount = document.getElementById("resultsCount");

            const query = searchInput.value.trim().toLowerCase();

            container.scrollTop = 0;

            if (!query) {
                container.innerHTML = `
                    <div class="p-10 text-center text-slate-400 text-xs bg-white rounded-2xl border border-slate-200 shadow-sm mt-4">
                        Type a medicine, brand name or composition to begin searching.
                    </div>
                `;

                resultsCount.innerText =
                    "Database ready - search your catalogue";

                return;
            }

            try {
                const tokens = query
                    .split(/\s+/)
                    .filter(token => token.length > 0);

                const conditions = [];
                const parameters = {};

                tokens.forEach((token, index) => {
                    const parameterName = `:token${index}`;

                    conditions.push(`
                        (
                            LOWER(COALESCE("Brand Name", '')) LIKE ${parameterName}
                            OR LOWER(COALESCE("API (Active Ingredients Only)", '')) LIKE ${parameterName}
                            OR LOWER(COALESCE("Exact Strength Group", '')) LIKE ${parameterName}
                            OR LOWER(COALESCE("Manufacturer", '')) LIKE ${parameterName}
                        )
                    `);

                    parameters[parameterName] = `%${token}%`;
                });

                const queryText = `
                    SELECT *
                    FROM "${escapeSqlIdentifier(tableName)}"
                    WHERE ${conditions.join(" AND ")}
                    LIMIT 80
                `;

                const statement = db.prepare(queryText);
                statement.bind(parameters);

                const rows = [];

                while (statement.step()) {
                    rows.push(statement.getAsObject());
                }

                statement.free();

                if (!rows.length) {
                    container.innerHTML = `
                        <div class="p-8 text-center text-slate-400 text-xs bg-white rounded-2xl border border-slate-200 shadow-sm">
                            No matching medicines found.
                        </div>
                    `;

                    resultsCount.innerText = "0 matches found";
                    return;
                }

                rows.sort((a, b) => {
                    const first =
                        isTopCompany(a["Manufacturer"]) ? 0 : 1;

                    const second =
                        isTopCompany(b["Manufacturer"]) ? 0 : 1;

                    return first - second;
                });

                resultsCount.innerText =
                    `${rows.length} records found`;

                container.innerHTML = rows.map(row => {
                    const brand = row["Brand Name"] || "-";
                    const manufacturer = row["Manufacturer"] || "-";
                    const strength = row["Exact Strength Group"] || "-";
                    const pack = row["Pack Size"] || "-";

                    return `
                        <div
                            onclick="openSubstituteModal(
                                '${escapeAttribute(strength)}',
                                '${escapeAttribute(brand)}'
                            )"
                            class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-indigo-300 active:scale-[0.99] transition cursor-pointer flex flex-col gap-1.5"
                        >
                            <div class="flex justify-between items-start gap-1">
                                <h3 class="font-bold text-slate-900 text-sm tracking-tight leading-snug">
                                    ${escapeHtml(brand)}
                                </h3>

                                <span class="text-[10px] bg-indigo-50 text-indigo-700 border border-indigo-100 font-bold px-2 py-0.5 rounded-full whitespace-nowrap">
                                    Substitutes
                                </span>
                            </div>

                            <p class="text-[11px] text-teal-700 font-semibold">
                                Composition:
                                <span class="text-slate-700 font-normal">
                                    ${escapeHtml(strength)}
                                </span>
                            </p>

                            <div class="flex justify-between items-center text-[11px] text-slate-500 pt-1.5 border-t border-slate-100">
                                <span class="truncate max-w-[68%]">
                                    Mfr:
                                    <span class="font-bold text-slate-800">
                                        ${escapeHtml(manufacturer)}
                                    </span>
                                </span>

                                <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md font-medium text-[10px]">
                                    Pack: ${escapeHtml(pack)}
                                </span>
                            </div>
                        </div>
                    `;
                }).join("");

            } catch (error) {
                console.error("Search error:", error);

                container.innerHTML = `
                    <div class="p-6 text-center text-rose-500 text-xs bg-white rounded-2xl">
                        Search error. Please check the database columns.
                    </div>
                `;
            }
        }

        function openSubstituteModal(strength, brandName) {
            document.getElementById("modalBrand").innerText =
                brandName;

            document.getElementById("modalComposition").innerText =
                `Strength / Concentration: ${strength}`;

            const listElement =
                document.getElementById("substitutesList");

            listElement.innerHTML = `
                <div class="p-6 text-center text-slate-400 text-xs bg-white rounded-2xl">
                    Searching exact substitutes...
                </div>
            `;

            document
                .getElementById("substituteModal")
                .classList
                .remove("hidden");

            try {
                const queryText = `
                    SELECT *
                    FROM "${escapeSqlIdentifier(tableName)}"
                    WHERE "Exact Strength Group" = :strength
                    LIMIT 200
                `;

                const statement = db.prepare(queryText);

                statement.bind({
                    ":strength": strength
                });

                const substitutes = [];

                while (statement.step()) {
                    substitutes.push(statement.getAsObject());
                }

                statement.free();

                substitutes.sort((a, b) => {
                    const first =
                        isTopCompany(a["Manufacturer"]) ? 0 : 1;

                    const second =
                        isTopCompany(b["Manufacturer"]) ? 0 : 1;

                    return first - second;
                });

                if (!substitutes.length) {
                    listElement.innerHTML = `
                        <div class="p-6 text-center text-slate-400 text-xs bg-white rounded-2xl">
                            No alternative brands found for this formulation.
                        </div>
                    `;

                    return;
                }

                listElement.innerHTML = substitutes.map(item => {
                    const brand = item["Brand Name"] || "-";
                    const manufacturer = item["Manufacturer"] || "-";
                    const pack = item["Pack Size"] || "-";

                    return `
                        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-0.5">
                            <h4 class="font-bold text-slate-900 text-xs">
                                ${escapeHtml(brand)}
                            </h4>

                            <p class="text-[11px] text-slate-600">
                                Manufacturer:
                                <span class="font-bold text-slate-800">
                                    ${escapeHtml(manufacturer)}
                                </span>
                            </p>

                            <p class="text-[10px] text-slate-400">
                                Pack: ${escapeHtml(pack)}
                            </p>
                        </div>
                    `;
                }).join("");

            } catch (error) {
                console.error("Substitute error:", error);

                listElement.innerHTML = `
                    <div class="p-6 text-center text-rose-500 text-xs bg-white rounded-2xl">
                        Unable to load substitutes.
                    </div>
                `;
            }
        }

        function closeModal() {
            document
                .getElementById("substituteModal")
                .classList
                .add("hidden");
        }

        function escapeSqlIdentifier(value) {
            return String(value).replace(/"/g, '""');
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeAttribute(value) {
            return String(value)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'")
                .replace(/"/g, "&quot;")
                .replace(/\r/g, "\\r")
                .replace(/\n/g, "\\n");
        }

        document
            .getElementById("substituteModal")
            .addEventListener("click", function(event) {
                if (event.target === this) {
                    closeModal();
                }
            });

        window.addEventListener("load", initDatabase);
    </script>
</body>
</html>
