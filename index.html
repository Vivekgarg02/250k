<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmisense Clinical & Substitute Search</title>
    <!-- Tailwind CSS UI Framework -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SQLite WebAssembly Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen py-4 px-2 flex justify-center items-center">

    <!-- Phone-shaped container optimized for mobile app layout -->
    <div class="w-full max-w-md sm:max-w-2xl bg-slate-50 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col h-[88vh] sm:h-[82vh]">
        
        <!-- Header & Search Box -->
        <div class="p-5 bg-gradient-to-r from-slate-900 via-slate-800 to-indigo-950 text-white flex-shrink-0 shadow-md">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">Pharmisense <span class="text-indigo-400 font-light">Rx</span></h1>
                </div>
                <div id="status" class="text-[10px] px-2.5 py-1 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-full text-slate-300 font-medium">
                    Initializing...
                </div>
            </div>
            
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="searchInput" oninput="debounceSearch()" disabled
                    placeholder="Search combinations..." 
                    class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/95 text-slate-900 text-sm font-medium shadow-inner placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-slate-200 transition">
            </div>
        </div>

        <!-- Sub-header status bar -->
        <div class="px-5 py-2.5 bg-white border-b border-slate-200 flex justify-between items-center text-[11px] text-slate-500 font-semibold flex-shrink-0 shadow-sm">
            <span id="resultsCount">Ready for search query...</span>
            <span class="hidden sm:inline text-indigo-600">Tap card to view substitutes</span>
        </div>

        <!-- Main Search Results Container -->
        <div id="resultsContainer" class="p-3.5 space-y-2.5 overflow-y-auto flex-1 bg-slate-100/70">
            <div class="p-10 text-center text-slate-400 text-xs bg-white rounded-2xl border border-slate-200 shadow-sm mt-4">
                <svg class="w-10 h-10 mx-auto text-slate-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                Type multiple components or a brand name to explore exact clinical substitutes.
            </div>
        </div>
    </div>

    <!-- Substitute Popup Modal -->
    <div id="substituteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm p-3">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full max-h-[85vh] overflow-hidden flex flex-col border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
            
            <!-- Modal Header -->
            <div class="p-4.5 bg-gradient-to-r from-indigo-900 to-slate-900 text-white flex justify-between items-start flex-shrink-0">
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-300">Exact Composition Match</span>
                    <h2 id="modalBrand" class="text-base sm:text-lg font-bold leading-tight mt-0.5 text-white">--</h2>
                    <p id="modalComposition" class="text-indigo-100 text-xs mt-1 font-medium">--</p>
                </div>
                <button onclick="closeModal()" class="text-slate-300 hover:text-white bg-slate-800/60 hover:bg-slate-700 w-8 h-8 rounded-full flex items-center justify-center text-lg font-bold transition">&times;</button>
            </div>

            <!-- Modal Body (Substitutes List) -->
            <div class="p-3.5 overflow-y-auto flex-1 bg-slate-50 space-y-2" id="substitutesList">
                <!-- Dynamic Content -->
            </div>

            <!-- Modal Footer -->
            <div class="p-3 bg-white border-t border-slate-200 text-right flex-shrink-0">
                <button onclick="closeModal()" class="w-full px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold shadow transition">
                    Close Window
                </button>
            </div>
        </div>
    </div>

    <script>
        let db = null;
        let searchTimeout = null;
        const tableName = "250k release type";

        // Top pharma companies priority list (ranked first silently)
        const topPharmaCompanies = [
            "Sun Pharmaceutical Industries Ltd", "Intas Pharmaceuticals Ltd", "Cipla Ltd",
            "Torrent Pharmaceuticals Ltd", "Alkem Laboratories Ltd", "Lupin Ltd",
            "Zydus Cadila", "Micro Labs Ltd", "Abbott", "Macleods Pharmaceuticals Pvt Ltd",
            "Mankind Pharma Ltd", "Dr Reddy's Laboratories Ltd", "Glenmark Pharmaceuticals Ltd",
            "Alembic Pharmaceuticals Ltd", "Ipca Laboratories Ltd", "Ajanta Pharma Ltd",
            "Sun Pharma", "Cipla", "Intas", "Torrent", "Alkem", "Lupin", "Dr Reddy"
        ];

        function isTopCompany(mfr) {
            if (!mfr) return false;
            return topPharmaCompanies.some(c => mfr.toLowerCase().includes(c.toLowerCase()));
        }

        async function initDatabase() {
            const statusEl = document.getElementById('status');
            try {
                const sqlPromise = initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
                const dataPromise = fetch('250k med.db').then(res => {
                    if (!res.ok) throw new Error("Database file '250k med.db' not found.");
                    return res.arrayBuffer();
                });

                const [SQL, buf] = await Promise.all([sqlPromise, dataPromise]);
                db = new SQL.Database(new Uint8Array(buf));
                
                statusEl.className = "text-[10px] px-2.5 py-1 bg-emerald-950 border border-emerald-800 text-emerald-300 font-bold rounded-full";
                statusEl.innerText = "● System Online";
                
                const inputEl = document.getElementById('searchInput');
                inputEl.disabled = false;
                
                if (inputEl.value.trim().length >= 1) {
                    handleSearch();
                }
            } catch (err) {
                statusEl.className = "text-[10px] px-2.5 py-1 bg-rose-950 border border-rose-800 text-rose-300 font-bold rounded-full";
                statusEl.innerText = "Error Loading DB";
            }
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                handleSearch();
            }, 250);
        }

        function handleSearch() {
            if (!db) return;
            const rawQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('resultsContainer');
            const countEl = document.getElementById('resultsCount');

            container.scrollTop = 0;

            if (!rawQuery || rawQuery.length === 0) {
                container.innerHTML = `<div class="p-10 text-center text-slate-400 text-xs bg-white rounded-2xl border border-slate-200 shadow-sm mt-4">Type multiple components or a brand name to explore exact clinical substitutes.</div>`;
                countEl.innerText = "Ready for search query...";
                return;
            }

            try {
                const tokens = rawQuery.split(/\s+/).filter(t => t.length > 0);
                
                let conditions = [];
                let params = {};

                tokens.forEach((token, index) => {
                    let paramName = `:t${index}`;
                    conditions.push(`(LOWER("Brand Name") LIKE ${paramName} OR LOWER("API (Active Ingredients Only)") LIKE ${paramName})`);
                    params[paramName] = `%${token}%`;
                });

                const sqlQuery = `
                    SELECT * FROM "${tableName}" 
                    WHERE ${conditions.join(' AND ')} 
                    LIMIT 80
                `;

                const stmt = db.prepare(sqlQuery);
                stmt.bind(params);
                
                let rows = [];
                while (stmt.step()) {
                    rows.push(stmt.getAsObject());
                }
                stmt.free();

                if (rows.length === 0) {
                    container.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs bg-white rounded-2xl border border-slate-200 shadow-sm">No combinations matched all keywords. Try broadening your terms.</div>`;
                    countEl.innerText = "0 matches found";
                    return;
                }

                rows.sort((a, b) => {
                    let aTop = isTopCompany(a['Manufacturer']) ? 0 : 1;
                    let bTop = isTopCompany(b['Manufacturer']) ? 0 : 1;
                    return aTop - bTop;
                });

                countEl.innerText = `${rows.length} records retrieved`;

                container.innerHTML = rows.map(r => {
                    const brand = r['Brand Name'] || '-';
                    const mfr = r['Manufacturer'] || '-';
                    const api = r['API (Active Ingredients Only)'] || '-';
                    const strength = r['Exact Strength Group'] || '-';
                    const pack = r['Pack Size'] || '-';

                    return `
                        <div onclick="openSubstituteModal('${escapeAttr(api)}', '${escapeAttr(strength)}', '${escapeAttr(brand)}')" 
                            class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-indigo-300 active:scale-[0.99] transition cursor-pointer flex flex-col gap-1.5">
                            <div class="flex justify-between items-start gap-1">
                                <h3 class="font-bold text-slate-900 text-sm tracking-tight leading-snug">${escapeHtml(brand)}</h3>
                                <span class="text-[10px] bg-indigo-50 text-indigo-700 border border-indigo-100 font-bold px-2 py-0.5 rounded-full whitespace-nowrap">Substitutes</span>
                            </div>
                            <p class="text-[11px] text-teal-700 font-semibold">API: ${escapeHtml(api)} <span class="text-slate-500 font-normal">(${escapeHtml(strength)})</span></p>
                            <div class="flex justify-between items-center text-[11px] text-slate-500 pt-1.5 border-t border-slate-100">
                                <span class="truncate max-w-[68%]">Mfr: <span class="font-bold text-slate-800">${escapeHtml(mfr)}</span></span>
                                <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md font-medium text-[10px]">Pack: ${escapeHtml(pack)}</span>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="p-6 text-center text-rose-500 text-xs bg-white rounded-2xl">Query execution error.</div>`;
            }
        }

        function openSubstituteModal(api, strength, brandName) {
            document.getElementById('modalBrand').innerText = brandName;
            document.getElementById('modalComposition').innerText = `API: ${api} | Strength: ${strength}`;

            const listEl = document.getElementById('substitutesList');
            listEl.scrollTop = 0;
            listEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs bg-white rounded-2xl">Searching exact substitutes...</div>`;
            document.getElementById('substituteModal').classList.remove('hidden');

            try {
                const stmt = db.prepare(`
                    SELECT * FROM "${tableName}" 
                    WHERE "API (Active Ingredients Only)" = :api 
                    AND "Exact Strength Group" = :strength
                `);
                
                stmt.bind({ ':api': api, ':strength': strength });
                let subs = [];
                while (stmt.step()) {
                    subs.push(stmt.getAsObject());
                }
                stmt.free();

                subs.sort((a, b) => {
                    let aTop = isTopCompany(a['Manufacturer']) ? 0 : 1;
                    let bTop = isTopCompany(b['Manufacturer']) ? 0 : 1;
                    return aTop - bTop;
                });

                if (subs.length === 0) {
                    listEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs bg-white rounded-2xl">No alternative brands found for this formulation.</div>`;
                } else {
                    listEl.innerHTML = subs.map(s => {
                        const mfr = s['Manufacturer'] || '-';
                        return `
                            <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-0.5">
                                <h4 class="font-bold text-slate-900 text-xs">${escapeHtml(s['Brand Name'])}</h4>
                                <p class="text-[11px] text-slate-600">Manufacturer: <span class="font-bold text-slate-800">${escapeHtml(mfr)}</span></p>
                                <p class="text-[10px] text-slate-400">Pack: ${escapeHtml(s['Pack Size'])}</p>
                            </div>
                        `;
                    }).join('');
                }
            } catch (e) {
                console.error(e);
                listEl.innerHTML = `<div class="p-6 text-center text-rose-500 text-xs bg-white rounded-2xl">Error loading substitutes.</div>`;
            }
        }

        function closeModal() {
            document.getElementById('substituteModal').classList.add('hidden');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeAttr(str) {
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        window.onload = initDatabase;
    </script>
</body>
</html>
