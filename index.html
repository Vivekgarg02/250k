<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmisense Search</title>
    <!-- Tailwind CSS UI Framework -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SQLite WebAssembly Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen py-4 px-2 flex justify-center items-center">

    <!-- Phone-shaped container optimized for mobile app layout -->
    <div class="w-full max-w-md sm:max-w-2xl bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden flex flex-col h-[85vh] sm:h-[80vh]">
        
        <!-- Header & Search Box -->
        <div class="p-4 bg-slate-900 text-white flex-shrink-0">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-base sm:text-lg font-bold text-teal-400">Pharmisense Search</h1>
                <div id="status" class="text-[10px] px-2.5 py-0.5 bg-slate-800 rounded-full text-slate-300">
                    Loading...
                </div>
            </div>
            
            <div class="relative">
                <input type="text" id="searchInput" oninput="debounceSearch()" disabled
                    placeholder="Enter brand name or API..." 
                    class="w-full px-4 py-3 rounded-xl text-slate-900 text-sm font-medium shadow-inner focus:outline-none focus:ring-2 focus:ring-teal-400 disabled:bg-slate-200">
            </div>
        </div>

        <!-- Sub-header status -->
        <div class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex justify-between items-center text-[11px] text-slate-500 font-semibold flex-shrink-0">
            <span id="resultsCount">Waiting for input...</span>
            <span class="hidden sm:inline">Tap card for substitutes</span>
        </div>

        <!-- Main Search Results Container -->
        <div id="resultsContainer" class="p-3 space-y-2.5 overflow-y-auto flex-1 bg-slate-50/50">
            <div class="p-8 text-center text-slate-400 text-xs bg-white rounded-xl border border-slate-200">
                Type brand name or API to search.
            </div>
        </div>
    </div>

    <!-- Substitute Popup Modal -->
    <div id="substituteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-3">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full max-h-[80vh] overflow-hidden flex flex-col">
            
            <!-- Modal Header -->
            <div class="p-4 bg-teal-800 text-white flex justify-between items-start flex-shrink-0">
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-teal-200">Selected Medicine</span>
                    <h2 id="modalBrand" class="text-lg font-bold leading-tight mt-0.5">--</h2>
                    <p id="modalComposition" class="text-teal-100 text-xs mt-1">--</p>
                </div>
                <button onclick="closeModal()" class="text-teal-200 hover:text-white text-2xl font-bold leading-none p-1">&times;</button>
            </div>

            <!-- Modal Body (Substitutes List) -->
            <div class="p-3 overflow-y-auto flex-1 bg-slate-50 space-y-2" id="substitutesList">
                <!-- Dynamic Content -->
            </div>

            <!-- Modal Footer -->
            <div class="p-3 bg-slate-100 border-t border-slate-200 text-right flex-shrink-0">
                <button onclick="closeModal()" class="w-full px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-semibold">
                    Close Window
                </button>
            </div>
        </div>
    </div>

    <script>
        let db = null;
        let searchTimeout = null;
        const tableName = "250k release type";

        // Top pharma companies priority list (ranked first silently)
        const topPharmaCompanies = [
            "Sun Pharmaceutical Industries Ltd", "Intas Pharmaceuticals Ltd", "Cipla Ltd",
            "Torrent Pharmaceuticals Ltd", "Alkem Laboratories Ltd", "Lupin Ltd",
            "Zydus Cadila", "Micro Labs Ltd", "Abbott", "Macleods Pharmaceuticals Pvt Ltd",
            "Mankind Pharma Ltd", "Dr Reddy's Laboratories Ltd", "Glenmark Pharmaceuticals Ltd",
            "Alembic Pharmaceuticals Ltd", "Ipca Laboratories Ltd", "Ajanta Pharma Ltd",
            "Sun Pharma", "Cipla", "Intas", "Torrent", "Alkem", "Lupin", "Dr Reddy"
        ];

        function isTopCompany(mfr) {
            if (!mfr) return false;
            return topPharmaCompanies.some(c => mfr.toLowerCase().includes(c.toLowerCase()));
        }

        async function initDatabase() {
            const statusEl = document.getElementById('status');
            try {
                const sqlPromise = initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
                const dataPromise = fetch('250k med.db').then(res => {
                    if (!res.ok) throw new Error("Database file '250k med.db' not found.");
                    return res.arrayBuffer();
                });

                const [SQL, buf] = await Promise.all([sqlPromise, dataPromise]);
                db = new SQL.Database(new Uint8Array(buf));
                
                statusEl.className = "text-[10px] px-2 py-0.5 bg-emerald-900 text-emerald-300 font-bold rounded-full";
                statusEl.innerText = "✓ Ready";
                
                const inputEl = document.getElementById('searchInput');
                inputEl.disabled = false;
                
                if (inputEl.value.trim().length >= 1) {
                    handleSearch();
                }
            } catch (err) {
                statusEl.className = "text-[10px] px-2 py-0.5 bg-rose-900 text-rose-300 font-bold rounded-full";
                statusEl.innerText = "Error";
            }
        }

        // Debounce search function to eliminate lag when typing quickly or multiple times
        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                handleSearch();
            }, 250); // Waits 250ms after the last key press before querying
        }

        function handleSearch() {
            if (!db) return;
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('resultsContainer');
            const countEl = document.getElementById('resultsCount');

            if (!query || query.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs bg-white rounded-xl border border-slate-200">Type brand name or API to search.</div>`;
                countEl.innerText = "Waiting for input...";
                return;
            }

            try {
                // Fuzzy/flexible query structure to support partial/slightly misspelled terms
                const cleanQuery = query.replace(/[^a-z0-9]/gi, '%');
                const stmt = db.prepare(`
                    SELECT * FROM "${tableName}" 
                    WHERE LOWER("Brand Name") LIKE :q OR LOWER("API (Active Ingredients Only)") LIKE :q 
                    LIMIT 80
                `);
                
                stmt.bind({ ':q': `%${cleanQuery}%` });
                let rows = [];
                while (stmt.step()) {
                    rows.push(stmt.getAsObject());
                }
                stmt.free();

                if (rows.length === 0) {
                    container.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs bg-white rounded-xl border border-slate-200">No matching medicines found. Check spelling or try a broader term.</div>`;
                    countEl.innerText = "0 results found";
                    return;
                }

                // Sort results: Top pharma companies first silently
                rows.sort((a, b) => {
                    let aTop = isTopCompany(a['Manufacturer']) ? 0 : 1;
                    let bTop = isTopCompany(b['Manufacturer']) ? 0 : 1;
                    return aTop - bTop;
                });

                countEl.innerText = `${rows.length} matches found`;

                container.innerHTML = rows.map(r => {
                    const brand = r['Brand Name'] || '-';
                    const mfr = r['Manufacturer'] || '-';
                    const api = r['API (Active Ingredients Only)'] || '-';
                    const strength = r['Exact Strength Group'] || '-';
                    const pack = r['Pack Size'] || '-';

                    return `
                        <div onclick="openSubstituteModal('${escapeAttr(api)}', '${escapeAttr(strength)}', '${escapeAttr(brand)}')" 
                            class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm active:bg-teal-50 transition cursor-pointer flex flex-col gap-1.5">
                            <div class="flex justify-between items-start gap-1">
                                <h3 class="font-bold text-slate-900 text-sm leading-snug">${escapeHtml(brand)}</h3>
                                <span class="text-[10px] bg-teal-100 text-teal-800 font-bold px-2 py-0.5 rounded whitespace-nowrap">Subs</span>
                            </div>
                            <p class="text-[11px] text-teal-700 font-semibold">API: ${escapeHtml(api)} (${escapeHtml(strength)})</p>
                            <div class="flex justify-between items-center text-[11px] text-slate-500 pt-1 border-t border-slate-100">
                                <span class="truncate max-w-[65%]"><strong>Manufacturer:</strong> <span class="font-bold text-slate-700">${escapeHtml(mfr)}</span></span>
                                <span class="bg-slate-100 px-1.5 py-0.5 rounded font-medium">Pack: ${escapeHtml(pack)}</span>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="p-6 text-center text-rose-500 text-xs bg-white rounded-xl">Query error occurred.</div>`;
            }
        }

        function openSubstituteModal(api, strength, brandName) {
            document.getElementById('modalBrand').innerText = brandName;
            document.getElementById('modalComposition').innerText = `API: ${api} | Strength: ${strength}`;

            const listEl = document.getElementById('substitutesList');
            listEl.innerHTML = `<div class="p-4 text-center text-slate-400 text-xs bg-white rounded-xl">Loading substitutes...</div>`;
            document.getElementById('substituteModal').classList.remove('hidden');

            try {
                const stmt = db.prepare(`
                    SELECT * FROM "${tableName}" 
                    WHERE "API (Active Ingredients Only)" = :api 
                    AND "Exact Strength Group" = :strength
                `);
                
                stmt.bind({ ':api': api, ':strength': strength });
                let subs = [];
                while (stmt.step()) {
                    subs.push(stmt.getAsObject());
                }
                stmt.free();

                // Sort substitutes: Top pharma companies first silently
                subs.sort((a, b) => {
                    let aTop = isTopCompany(a['Manufacturer']) ? 0 : 1;
                    let bTop = isTopCompany(b['Manufacturer']) ? 0 : 1;
                    return aTop - bTop;
                });

                if (subs.length === 0) {
                    listEl.innerHTML = `<div class="p-4 text-center text-slate-400 text-xs bg-white rounded-xl">No alternative brands found.</div>`;
                } else {
                    listEl.innerHTML = subs.map(s => {
                        const mfr = s['Manufacturer'] || '-';
                        return `
                            <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-0.5">
                                <h4 class="font-bold text-slate-900 text-xs">${escapeHtml(s['Brand Name'])}</h4>
                                <p class="text-[11px] text-slate-600"><strong>Manufacturer:</strong> <span class="font-bold text-slate-700">${escapeHtml(mfr)}</span></p>
                                <p class="text-[10px] text-slate-400"><strong>Pack:</strong> ${escapeHtml(s['Pack Size'])}</p>
                            </div>
                        `;
                    }).join('');
                }
            } catch (e) {
                console.error(e);
                listEl.innerHTML = `<div class="p-4 text-center text-rose-500 text-xs bg-white rounded-xl">Error loading substitutes.</div>`;
            }
        }

        function closeModal() {
            document.getElementById('substituteModal').classList.add('hidden');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeAttr(str) {
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        window.onload = initDatabase;
    </script>
</body>
</html>
